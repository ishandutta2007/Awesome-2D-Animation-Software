<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <!-- Keyframe timeline style -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      /* Dynamic Animated Floating Elements in Background */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(4deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes timelineSweep {
        0% { transform: translateX(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateX(960px); opacity: 0.2; }
      }
      @keyframes morphPath {
        0%, 100% { d: path("M 80 180 Q 220 80 360 180 T 640 180"); }
        50% { d: path("M 80 180 Q 220 280 360 180 T 640 180"); }
      }
      @keyframes rotateKeyframe {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .anim-glow1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .anim-glow2 {
        animation: pulseGlow 9s ease-in-out infinite alternate-reverse;
        transform-origin: center;
      }
      .anim-float1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-float2 {
        animation: floatSlow 8s ease-in-out infinite 1.5s;
      }
      .anim-float3 {
        animation: floatSlow 7s ease-in-out infinite 3s;
      }
      .anim-sweep {
        animation: timelineSweep 5s linear infinite;
      }
      .anim-rot {
        animation: rotateKeyframe 20s linear infinite;
        transform-origin: 1040px 100px;
      }
      .badge-pill {
        transition: all 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Dynamic Animated Glow Spheres (Layered behind text) -->
  <circle class="anim-glow1" cx="220" cy="120" r="180" fill="url(#glowGrad1)" />
  <circle class="anim-glow2" cx="980" cy="240" r="220" fill="url(#glowGrad2)" />

  <!-- Animated Geometric / Keyframe Nodes in Background -->
  <g class="anim-float1" opacity="0.35">
    <rect x="80" y="60" width="48" height="48" rx="8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="104" cy="84" r="6" fill="#38bdf8" />
  </g>

  <g class="anim-rot" opacity="0.25">
    <polygon points="1040,75 1065,100 1040,125 1015,100" fill="none" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="1040" cy="100" r="18" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <g class="anim-float2" opacity="0.3">
    <!-- Onion-skinning sketch frame illusion -->
    <rect x="980" y="220" width="130" height="85" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" />
    <path d="M 1000 270 Q 1045 230 1090 270" fill="none" stroke="#f472b6" stroke-width="2" />
  </g>

  <g class="anim-float3" opacity="0.25">
    <rect x="130" y="240" width="110" height="70" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="185" cy="275" r="16" fill="none" stroke="#38bdf8" stroke-width="2" />
    <line x1="185" y1="250" x2="185" y2="300" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  </g>

  <!-- Dynamic Timeline Bar at Bottom of Card -->
  <g opacity="0.4">
    <line x1="120" y1="315" x2="1080" y2="315" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round" />
    <!-- Keyframe ticks -->
    <line x1="120" y1="308" x2="120" y2="322" stroke="#38bdf8" stroke-width="2" />
    <line x1="240" y1="310" x2="240" y2="320" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <line x1="360" y1="308" x2="360" y2="322" stroke="#818cf8" stroke-width="2" />
    <line x1="480" y1="310" x2="480" y2="320" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <line x1="600" y1="308" x2="600" y2="322" stroke="#c084fc" stroke-width="2" />
    <line x1="720" y1="310" x2="720" y2="320" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <line x1="840" y1="308" x2="840" y2="322" stroke="#f472b6" stroke-width="2" />
    <line x1="960" y1="310" x2="960" y2="320" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <line x1="1080" y1="308" x2="1080" y2="322" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Moving Playhead Cursor -->
    <g class="anim-sweep">
      <polygon points="120,305 127,314 120,323 113,314" fill="#38bdf8" />
      <line x1="120" y1="298" x2="120" y2="330" stroke="#38bdf8" stroke-width="1.5" />
    </g>
  </g>

  <!-- Foreground Main Title & Content (Crisp, High Contrast, Guaranteed Legibility) -->
  <g filter="url(#shadow)">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 68)">
      <rect x="-140" y="-18" width="280" height="34" rx="17" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="1.5">🎬 CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5">
      Awesome 2D Animation Software
    </text>

    <!-- Subtitle Description -->
    <text x="600" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2">
      Traditional Hand-Drawn • Skeletal Cut-Out • Vector Tweening • Programmatic Motion
    </text>

    <!-- Capability Tags/Pills (Foreground) -->
    <g transform="translate(600, 246)">
      <!-- Pill 1 -->
      <g transform="translate(-330, 0)">
        <rect x="0" y="-14" width="145" height="28" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="72" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">🎨 Frame-by-Frame</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-165, 0)">
        <rect x="0" y="-14" width="145" height="28" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="#818cf8" stroke-width="1.2"/>
        <text x="72" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">🦴 Bone Rigging</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="-14" width="145" height="28" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="#c084fc" stroke-width="1.2"/>
        <text x="72" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff" text-anchor="middle">⚡ Code &amp; Motion</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(165, 0)">
        <rect x="0" y="-14" width="165" height="28" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="#f472b6" stroke-width="1.2"/>
        <text x="82" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8" text-anchor="middle">🌟 Open-Source &amp; SaaS</text>
      </g>
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
</svg>
